<!--
  SmartBID - Template de e-mail das notificações (fluxo "SmartBid - Notifications").
  Apague este comentário antes de colar no Body de "Send an email notification (V3)" (modo código </>).
  Tokens (substitua conforme NOTIFICATIONS.md, passo 14.1 d):
    [[TONE_COLOR]]  [[TITLE]]  [[SUBTITLE]]  [[HEADLINE]]  [[FACT_ROWS_HTML]]  [[DEEP_LINK]]  [[FOOTER]]
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartBID</title>
  </head>
  <body
    style="margin: 0; padding: 0; background-color: #eef2f6; font-family: 'Segoe UI', Arial, sans-serif; color: #0f172a"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      bgcolor="#eef2f6"
      style="background-color: #eef2f6; padding: 28px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            bgcolor="#ffffff"
            style="max-width: 600px; width: 100%; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden"
          >
            <!-- Brand bar -->
            <tr>
              <td height="4" bgcolor="#00c9a7" style="height: 4px; line-height: 4px; font-size: 0; background-color: #00c9a7">&nbsp;</td>
            </tr>

            <!-- Header -->
            <tr>
              <td bgcolor="#0f1b2d" style="background-color: #0f1b2d; padding: 26px 36px 24px 36px">
                <div style="font-size: 11px; letter-spacing: 2.4px; text-transform: uppercase; color: #00c9a7; font-weight: 700">
                  SmartBID &middot; Oceaneering
                </div>
                <div style="font-size: 24px; line-height: 1.3; font-weight: 700; color: #ffffff; margin-top: 8px">
                  [[TITLE]]
                </div>
                <div style="font-size: 14px; line-height: 1.5; color: #94a3b8; margin-top: 6px">
                  [[SUBTITLE]]
                </div>
              </td>
            </tr>

            <!-- Headline -->
            <tr>
              <td style="padding: 28px 36px 8px 36px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td width="4" bgcolor="[[TONE_COLOR]]" style="width: 4px; background-color: [[TONE_COLOR]]; border-radius: 4px">&nbsp;</td>
                    <td bgcolor="#f8fafc" style="background-color: #f8fafc; padding: 14px 18px; font-size: 15px; line-height: 1.6; color: #0f172a">
                      [[HEADLINE]]
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Details -->
            <tr>
              <td style="padding: 20px 36px 4px 36px">
                <div style="font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 8px">
                  Detalhes
                </div>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="border: 1px solid #e2e8f0; border-radius: 10px; border-collapse: separate; overflow: hidden"
                >
                  [[FACT_ROWS_HTML]]
                </table>
              </td>
            </tr>

            <!-- CTA -->
            <tr>
              <td align="left" style="padding: 24px 36px 32px 36px">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td bgcolor="#0d9488" style="background-color: #0d9488; border-radius: 8px">
                      <a
                        href="[[DEEP_LINK]]"
                        style="display: inline-block; padding: 13px 28px; font-size: 14px; font-weight: 600; color: #ffffff; text-decoration: none; border-radius: 8px"
                        >Abrir no SmartBID &rarr;</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td bgcolor="#f8fafc" style="background-color: #f8fafc; border-top: 1px solid #e2e8f0; padding: 18px 36px">
                <p style="margin: 0 0 6px 0; font-size: 12px; line-height: 1.6; color: #64748b">[[FOOTER]]</p>
                <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #94a3b8">
                  E-mail automático do SmartBID. Quem recebe cada evento é definido pelo time de Engineering em
                  System Configuration &gt; Notifications.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
