<!--
  SmartBID - Template de e-mail das notificações (fluxo "SmartBid - Notifications").
  Cole no Compose "comEmailHtml" (NOTIFICATIONS.md, passo 14.1 d), NÃO no Body do e-mail.
  Apague este comentário antes de colar.
  Tokens: [[TONE_COLOR]] [[TITLE]] [[PROJECT]] [[CLIENT]] [[SUBTITLE]] [[HEADLINE]] [[FACT_ROWS_HTML]] [[DEEP_LINK]] [[FOOTER]]
-->
<!-- prettier-ignore -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef2f6" style="width:100%;background-color:#eef2f6;font-family:'Segoe UI',Arial,sans-serif;color:#0f172a;">
  <tr>
    <td align="center" style="padding:28px 12px;">
      <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:640px;max-width:640px;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:12px;">
        <tr>
          <td width="640" height="4" bgcolor="#00c9a7" style="width:640px;height:4px;line-height:4px;font-size:0;background-color:#00c9a7;border-radius:12px 12px 0 0;">&nbsp;</td>
        </tr>
        <tr>
          <td width="640" bgcolor="#0f1b2d" style="width:640px;background-color:#0f1b2d;padding:24px 36px 26px 36px;">
            <p style="margin:0;font-size:11px;line-height:16px;letter-spacing:2px;text-transform:uppercase;color:#00c9a7;font-weight:700;">SmartBID &middot; Oceaneering</p>
            <p style="margin:10px 0 0 0;font-size:15px;line-height:22px;font-weight:600;color:#cbd5e1;">[[TITLE]]</p>
            <p style="margin:12px 0 0 0;font-size:24px;line-height:31px;font-weight:700;color:#ffffff;">[[PROJECT]]</p>
            <p style="margin:4px 0 0 0;font-size:16px;line-height:23px;font-weight:600;color:#e2e8f0;">[[CLIENT]]</p>
            <p style="margin:8px 0 0 0;font-size:13px;line-height:19px;color:#94a3b8;">[[SUBTITLE]]</p>
          </td>
        </tr>
        <tr>
          <td width="640" style="width:640px;padding:28px 36px 4px 36px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
              <tr>
                <td bgcolor="#f8fafc" style="background-color:#f8fafc;border-left:4px solid [[TONE_COLOR]];padding:14px 18px;font-size:15px;line-height:24px;color:#0f172a;">[[HEADLINE]]</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td width="640" style="width:640px;padding:22px 36px 4px 36px;">
            <p style="margin:0 0 8px 0;font-size:11px;line-height:16px;letter-spacing:1.2px;text-transform:uppercase;color:#64748b;font-weight:700;">Detalhes</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border:1px solid #e2e8f0;border-collapse:collapse;">
              [[FACT_ROWS_HTML]]
            </table>
          </td>
        </tr>
        <tr>
          <td width="640" style="width:640px;padding:24px 36px 30px 36px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td bgcolor="#0d9488" style="background-color:#0d9488;border-radius:8px;">
                  <a href="[[DEEP_LINK]]" style="display:inline-block;padding:13px 28px;font-size:14px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;">Abrir no SmartBID &rarr;</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td width="640" bgcolor="#f8fafc" style="width:640px;background-color:#f8fafc;border-top:1px solid #e2e8f0;padding:18px 36px;border-radius:0 0 12px 12px;">
            <p style="margin:0 0 6px 0;font-size:12px;line-height:19px;color:#64748b;">[[FOOTER]]</p>
            <p style="margin:0;font-size:12px;line-height:19px;color:#94a3b8;">E-mail automático do SmartBID. Quem recebe cada evento é definido pelo time de Engineering em System Configuration &gt; Notifications.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
